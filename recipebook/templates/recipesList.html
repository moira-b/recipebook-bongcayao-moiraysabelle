{% extends 'base.html' %}

{% block subheading %} Recipe List {% endblock %}

{% block content %}

<ul>
    {% for recipe in object_list %}
    <li>
        <a href="{{recipe.get_absolute_url}}">{{recipe.name}}</a>
    </li>
    {% endfor %}
</ul>

<br><br>
<a href="{% url 'ledger:recipe-creation' %}"> Create a New Recipe </a>

{% endblock %}
