{% extends 'base.html' %}

<title>{% block title %}Recipe Book{% endblock %}</title>

{% block content %}
    <h1> 
        Recipe Book
    </h1>
    <ul>
        {% for recipe in object_list %}
            <li>
                <a href="{{recipe.get_asolute_url}}">{{recipe.name}}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
