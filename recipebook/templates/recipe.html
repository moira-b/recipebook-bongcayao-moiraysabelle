{% extends 'base.html' %}

<title>{% block title %}Recipe Book{% endblock %}</title>

{% block content %}
    <h1> 
        Recipe Book
    </h1>
    <h2> 
        {{name}}
    </h2>

    <ul>
        {% for ingredient in ingredients %}
            <li>
                {{ingredient.name}} ({{ingredient.quantity}})
            </li>
        {% endfor %}
    </ul>
{% endblock %}
