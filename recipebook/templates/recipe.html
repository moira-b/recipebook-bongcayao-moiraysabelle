{% extends 'base.html' %}

{% block subheading %} {{object.name}} Recipe {% endblock %}

{% block content %}

    <p>
        Written by {{object.author}}
    </p>

    <ul>
        {% for ingredient in object.ingredients.all %}
            <li>
                {{ingredient.ingredientType.name}} ({{ingredient.quantity}})
            </li>
        {% endfor %}
    </ul>

    <button type="submit">
        <p><a href="{% url 'ledger:recipe-list' %}">Back to recipe list</a></p>
    </button>

{% endblock %}
